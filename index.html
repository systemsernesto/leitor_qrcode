<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Scanner QR</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow-x: hidden;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #1a1a2e;
      color: #fff;
      padding: 16px;
      padding-top: max(16px, env(safe-area-inset-top));
      padding-bottom: max(16px, env(safe-area-inset-bottom));
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 12px;
    }
    #reader {
      width: 100%;
      max-width: 380px;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    #reader video {
      width: 100% !important;
      border-radius: 12px;
    }
    #resultado {
      width: 100%;
      max-width: 380px;
      background: #16213e;
      border-radius: 10px;
      padding: 14px;
      min-height: 50px;
      word-break: break-all;
      font-size: 0.95rem;
    }
    #resultado strong { color: #4fc3f7; }
    .links {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .links a {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      transition: opacity 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .links a:active { opacity: 0.8; }
    .link-google {
      background: #4285f4;
      color: #fff;
    }
    .link-site {
      background: #2e7d32;
      color: #fff;
    }
    .btn-row {
      margin-top: 14px;
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 380px;
    }
    .btn-row button {
      flex: 1;
      padding: 14px 0;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-row button:active { opacity: 0.8; }
    .btn-copy { background: #4fc3f7; color: #1a1a2e; }
    .btn-reset { background: #37474f; color: #fff; }
    .status {
      margin-top: 10px;
      font-size: 0.85rem;
      color: #aaa;
    }
    .status.ok { color: #66bb6a; }
    .status.err { color: #ef5350; }
  </style>
</head>
<body>
  <h1>📷 Scanner QR</h1>
  <div id="reader"></div>
  <div id="resultado">
    <strong>Resultado:</strong> Aguardando scan...
  </div>
  <div class="btn-row">
    <button class="btn-copy" onclick="copiar()">📋 Copiar</button>
    <button class="btn-reset" onclick="resetar()">🔄 Novo Scan</button>
  </div>
  <p class="status" id="status"></p>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <script>
    let scanner = null;
    let lastCode = "";

    const statusEl = document.getElementById("status");
    const resultadoEl = document.getElementById("resultado");

    function setStatus(msg, cls) {
      statusEl.textContent = msg;
      statusEl.className = "status" + (cls ? " " + cls : "");
    }

    function iniciarScanner() {
      scanner = new Html5QrcodeScanner(
        "reader",
        {
          fps: 10,
          qrbox: { width: 250, height: 250 },
          useBarCodeDetectorIfSupported: true,
          rememberLastUsedCamera: true,
          showTorchButtonIfSupported: true
        },
        false
      );

      scanner.render(
        (decodedText) => {
          lastCode = decodedText;
          const encoded = encodeURIComponent(decodedText);

          resultadoEl.innerHTML = `
            <strong>Resultado:</strong> ${decodedText}
            <div class="links">
              <a href="https://www.google.com/search?q=${encoded}" target="_blank" rel="noopener">🔍 Pesquisar no Google</a>
              <a href="http://www.meusite.com.br/pasta/${encoded}" target="_blank" rel="noopener">📄 Acessar no Site</a>
            </div>
          `;
          setStatus("✅ Código lido com sucesso!", "ok");
        },
        () => {}
      );
    }

    function copiar() {
      if (!lastCode) { setStatus("Nenhum código para copiar.", "err"); return; }
      navigator.clipboard.writeText(lastCode)
        .then(() => setStatus("📋 Copiado!", "ok"))
        .catch(() => {
          // Fallback para iOS
          const ta = document.createElement("textarea");
          ta.value = lastCode;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
          setStatus("📋 Copiado!", "ok");
        });
    }

    function resetar() {
      lastCode = "";
      resultadoEl.innerHTML = "<strong>Resultado:</strong> Aguardando scan...";
      setStatus("");
      if (scanner) {
        scanner.stop().then(() => {
          iniciarScanner();
        }).catch(() => {
          setStatus("Erro ao reiniciar.", "err");
        });
      }
    }

    // Inicia ao carregar
    iniciarScanner();
  </script>
</body>
</html>
