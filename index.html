<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scanner QR Code v1</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #1a1a2e;
      color: #fff;
      padding: 20px;
    }
    h1 { margin-bottom: 20px; font-size: 1.5rem; }
    #reader {
      border-radius: 12px;
      overflow: hidden;
      width: 100%;
      max-width: 400px;
      margin-bottom: 20px;
    }
    #resultado {
      width: 100%;
      max-width: 400px;
      background: #16213e;
      border-radius: 8px;
      padding: 16px;
      min-height: 60px;
      word-break: break-all;
    }
    #resultado strong { color: #4fc3f7; }
    .links {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .links a {
      display: block;
      padding: 10px 14px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      text-align: center;
      transition: opacity 0.2s;
    }
    .links a:hover { opacity: 0.85; }
    .link-google {
      background: #4285f4;
      color: #fff;
    }
    .link-site {
      background: #2e7d32;
      color: #fff;
    }
    
    .link-site-direto {
      background: #9999ff;
      color: #fff;
    }
    
    button {
      margin-top: 16px;
      padding: 10px 24px;
      border: none;
      border-radius: 6px;
      background: #4fc3f7;
      color: #1a1a2e;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #81d4fa; }
  </style>
</head>
<body>
  <h1>📷 Allent <br> Scanner QR Code</h1>
  <div id="reader"></div>
  <div id="resultado">
    <strong>Resultado:</strong> Aguardando scan...
    <div class="links" id="links" style="display:none;">
      <a id="linkGoogle" class="link-google" target="_blank">🔍 Pesquisar no Google</a>
      <a id="linkSite" class="link-site" target="_blank">📄 Acessar no Site</a>
      <a id="linkSiteDireto" class="link-site-direto" target="_blank">📄 Acessar no Link Direto</a>
    </div>
  </div>
  <button onclick="copiar()">Copiar</button>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <script>
    const html5QrcodeScanner = new Html5QrcodeScanner(
      "reader",
      {
        fps: 10,
        qrbox: { width: 250, height: 250 },
        useBarCodeDetectorIfSupported: true,
        rememberLastUsedCamera: true,
        showTorchButtonIfSupported: true
      },
      false
    );

    html5QrcodeScanner.render(
      (decodedText) => {
        const encoded = encodeURIComponent(decodedText);

        // Atualiza o texto do resultado
        document.getElementById("resultado").innerHTML = `
          <strong>Resultado:</strong> ${decodedText}
          <div class="links">
            <a id="linkGoogle" class="link-google" target="_blank">🔍 Pesquisar no Google</a>
            <a id="linkSite" class="link-site" target="_blank">📄 Acessar no Site</a>
            <a id="linkSiteDireto" class="link-site-direto" target="_blank">📄 Acessar no Link Direto</a>
          </div>
        `;

        // Link 1: Google Search
        document.getElementById("linkGoogle").href =
          `https://www.google.com/search?q=${encoded}`;

        // Link 2: Página do site
        document.getElementById("linkSite").href =
          `http://www.meusite.com.br/pasta/${encoded}`;
        
         // Link 3: Página do site
        document.getElementById("linkSiteDireto").href =
          `${encoded}`;  
          
      },
      (errorMessage) => {}
    );

    function copiar() {
      const texto = document.getElementById("resultado")
        .querySelector("strong")
        .nextSibling.textContent.trim();
      navigator.clipboard.writeText(texto)
        .then(() => alert("Copiado!"))
        .catch(() => alert("Erro ao copiar."));
    }
  </script>
</body>
</html>
